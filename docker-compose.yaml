x-env_file:
  &env-file
  env_file:
    - ./.env
    - ./.env.${NODE_ENV}

x-network:
  &network
  networks:
    - postgres-network

x-restart-policy:
  &restart-policy
  restart: always

x-logging:
  &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  database:
    <<: [*env-file, *network, *restart-policy, *logging]
    build:
      context: .
      dockerfile: ./Database.Dockerfile
      args:
        - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER}"
      interval: 1s
      timeout: 1s
      retries: 60

  bot:
    <<: [*env-file, *network, *restart-policy, *logging]
    environment:
      - NODE_ENV=${NODE_ENV}
    build:
      context: .
      dockerfile: ./Dockerfile
    command: dotenvx run --convention=nextjs -- sh /app/scripts/entrypoint.sh
    volumes:
      - bot_logs:/var/log/datadrop/
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    <<: [*network, *restart-policy, *logging]
    image: redis:7.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  postgres:
  bot_logs:

networks:
  postgres-network:
